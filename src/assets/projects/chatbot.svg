<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
	<defs>
		<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
			<feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.45"/>
		</filter>
		<clipPath id="frame"><rect width="1600" height="1000"/></clipPath>
	</defs>
	<rect width="1600" height="1000" fill="#1c1d22"/>

	<!-- Terminal window, cut off by the bottom edge like the plate screenshots -->
	<g clip-path="url(#frame)">
		<rect x="140" y="110" width="1320" height="960" rx="26" fill="#2a2d35" filter="url(#shadow)"/>
		<rect x="140.5" y="110.5" width="1319" height="959" rx="25.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>
		<circle cx="190" cy="160" r="12" fill="#ff5f57"/>
		<circle cx="230" cy="160" r="12" fill="#febc2e"/>
		<circle cx="270" cy="160" r="12" fill="#28c840"/>
		<text x="800" y="169" text-anchor="middle" fill="#8b8d94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="500">chatbot.py</text>
		<rect x="140" y="208" width="1320" height="1" fill="#fff" fill-opacity="0.06"/>

		<g font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="36" fill="#e4e5e9">
			<text x="200" y="290"><tspan fill="#7cc0ff">You:</tspan> hello</text>
			<text x="200" y="350"><tspan fill="#a8abb3">ChatBot:</tspan> Do you have any holiday plans for christmas?</text>
			<text x="200" y="410"><tspan fill="#7cc0ff">You:</tspan> well yes i do! i’m going skiing.</text>
			<text x="200" y="470"><tspan fill="#a8abb3">ChatBot:</tspan> That sounds amazing. I want to learn how to</text>
			<text x="200" y="530">ski but I feel like I’m too old and falls would</text>
			<text x="200" y="590">have lifelong impacts. Are you going with friends?</text>
			<text x="200" y="650"><tspan fill="#7cc0ff">You:</tspan> yes im going with friends</text>
			<text x="200" y="710"><tspan fill="#a8abb3">ChatBot:</tspan> Where to?</text>
			<text x="200" y="770"><tspan fill="#7cc0ff">You:</tspan> to tokyo</text>
			<text x="200" y="830"><tspan fill="#a8abb3">ChatBot:</tspan> Ahh yes, Japan is hot during the summer.</text>
			<text x="200" y="890"><tspan fill="#7cc0ff">You:</tspan></text>
			<rect x="315" y="860" width="20" height="38" fill="#e4e5e9"/>
		</g>
	</g>
</svg>
